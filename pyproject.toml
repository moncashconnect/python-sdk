[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moncashconnect"
version = "1.0.0"
description = "Python SDK for MonCashConnect — independent MonCash payment integration platform for Haiti."
readme = "README.md"
license = "MIT"
authors = [{ name = "MonCashConnect", email = "contact@moncashconnect.com" }]
keywords = ["moncash", "haiti", "payment", "mobile-money", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://moncashconnect.com"
Documentation = "https://moncashconnect.com/docs"
Repository = "https://github.com/moncashconnect/python-sdk"

[tool.setuptools.packages.find]
where = ["."]
include = ["moncashconnect*"]
